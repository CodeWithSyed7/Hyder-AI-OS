    <script>
      /* Guard against "Cannot set property fetch of #<Window> which has only a getter" */
      (function() {
        try {
          var targetObj = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : self);
          if (!targetObj) return;

          // Catch any uncaught errors regarding fetch getter and suppress fatal termination
          targetObj.addEventListener('error', function(event) {
            if (event && event.message && (
              event.message.indexOf('Cannot set property fetch') !== -1 ||
              (event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1)
            )) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);

          var rawFetch = targetObj.fetch;
          if (typeof rawFetch === 'function') {
            var activeFetch = rawFetch.bind(targetObj);
            try {
              Object.defineProperty(targetObj, 'fetch', {
                get: function() {
                  return activeFetch;
                },
                set: function(fn) {
                  activeFetch = typeof fn === 'function' ? fn : activeFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (err1) {
              if (typeof Window !== 'undefined' && Window.prototype) {
                try {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() {
                      return activeFetch;
                    },
                    set: function(fn) {
                      activeFetch = typeof fn === 'function' ? fn : activeFetch;
                    },
                    configurable: true,
                    enumerable: true
                  });
                } catch (err2) {}
              }
            }
          }
        } catch (e) {}
      })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-navy: #050b18;
        --aqua: #00E5FF;
        --teal: #2ED8C3;
        --white-glow: #EAFBFF;
        --glass: rgba(10, 26, 47, 0.4);
        --glass-border: rgba(0, 229, 255, 0.1);
      }

      .eye-care {
        filter: sepia(0.2) contrast(1.05) brightness(0.9);
      }

      * {
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        cursor: crosshair;
      }

      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 100vh;
        background-color: var(--bg-navy);
        color: var(--white-glow);
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        box-sizing: border-box;
      }

      *, *:before, *:after {
        box-sizing: border-box;
      }

      .water-bg {
        position: fixed;
        inset: 0;
        z-index: -2;
        background: radial-gradient(circle at 50% 50%, #0D2137 0%, #050b18 100%);
      }

      .water-waves {
        position: fixed;
        inset: 0;
        z-index: -1;
        opacity: 0.3;
        background: radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.05) 0%, transparent 40%),
                    radial-gradient(circle at 80% 70%, rgba(46, 216, 195, 0.05) 0%, transparent 40%);
        animation: waveFlow 15s ease-in-out infinite alternate;
      }

      @keyframes waveFlow {
        from { transform: scale(1) translate(0, 0); }
        to { transform: scale(1.1) translate(20px, 10px); }
      }

      .neural-grid {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: linear-gradient(var(--glass-border) 1px, transparent 1px),
                          linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(circle at center, black, transparent 80%);
        opacity: 0.1;
      }

      .glass-panel {
        background: var(--glass);
        backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid var(--glass-border);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      /* Smooth Pulse Transition with Cubic-Bezier */
      .animate-pulse {
        animation: smoothPulse 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite !important;
      }
      @keyframes smoothPulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.62;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .animate-pulse {
          animation: none !important;
          opacity: 1 !important;
        }
      }

      /* AI Face Animations */
      @keyframes eyeBlink {
        0%, 90%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
      }
      .ai-eye { animation: eyeBlink 4s infinite; }

      @keyframes mouthTalk {
        0%, 100% { width: 40px; height: 4px; border-radius: 2px; }
        50% { width: 30px; height: 12px; border-radius: 50%; }
      }
      .mouth-talking { animation: mouthTalk 0.3s infinite; }

      @keyframes mouthHappy {
        from { border-radius: 0 0 50px 50px; height: 20px; }
        to { border-radius: 0 0 50px 50px; height: 20px; }
      }

      /* Sleep Mode Layers */
      .sleep-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        animation: fadeIn 1s forwards;
      }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

      .font-orbitron { font-family: 'Orbitron', sans-serif; }
      .font-mono { font-family: 'JetBrains+Mono', monospace; }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--aqua); border-radius: 10px; }
    </style>
